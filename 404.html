<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Page not found — Stackly Holiday Packages." />
  <title>404 — Page Not Found | Stackly</title>

  <!-- Fonts (same as site) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Remix Icons (same as site) -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />

  <!-- 404 Page Stylesheet -->
  <link rel="stylesheet" href="assets/css/404.css" />
</head>
<body>

  <main class="error-page" id="errorPage">

    <!-- Decorative background layer, same visual language as hero -->
    <div class="error-bg" aria-hidden="true">
      <div class="error-bg-shape shape-gold"></div>
      <div class="error-bg-shape shape-teal"></div>
    </div>

    <div class="error-content">

      <a href="index.html" class="error-logo" aria-label="Stackly Home">
        <span class="logo-icon"><i class="ri-compass-discover-line"></i></span>
        <span class="logo-text">Stackly</span>
      </a>

      <div class="error-icon" aria-hidden="true">
        <i class="ri-map-pin-line"></i>
      </div>

      <p class="error-code">4<span class="text-accent">0</span>4</p>

      <p class="error-eyebrow">Off The Beaten Path</p>

      <h1 class="error-title">Looks Like You've <em>Wandered</em> Off The Map</h1>

      <p class="error-subtitle">
        The page you're looking for has either been moved, renamed, or never
        existed. Let's get you back on course to your next adventure.
      </p>

      <div class="error-actions">
        <a href="index.html" class="btn-outline-primary">
          <i class="ri-home-4-line"></i>
          Back to Homepage
        </a>
        <button type="button" class="btn-gold" id="goBackButton">
          <i class="ri-arrow-left-line"></i>
          Go Back
        </button>
      </div>


    </div>

  </main>

  <script src="assets/js/404.js"></script>
</body>
</html>
